# Configuración de photon-wifi-drive. instalar.sh la copia a
# /etc/photon-wifi-drive.conf la primera vez y ya no la vuelve a pisar.

# La carpeta que se comparte por la red (\\<tarjeta>\photon). Lo que tenga es lo
# que la impresora ve en la memoria.
CARPETA=/srv/photon-wifi-drive

# La imagen que la impresora ve como memoria USB.
IMAGEN=/var/lib/photon-wifi-drive/disco.img

# Tamaño y nombre de la memoria. Solo cuentan al crearla: para cambiarlos hay
# que borrar la imagen y volver a correr instalar.sh. Lo que tenga la carpeta no
# debe pasar de este tamaño.
TAMANO=4G
ETIQUETA=PHOTON
